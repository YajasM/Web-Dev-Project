<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Card - Lemon Garlic Pasta</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <div class="recipe-card">

    <!-- image side -->
    <div class="recipe-image">
      🍝
    </div>

    <!-- text side -->
    <div class="recipe-info">
      <h1 class="recipe-title">Lemon Garlic Pasta</h1>
      <p class="recipe-text">
        A quick weeknight pasta with garlic, chilli flakes and a
        squeeze of fresh lemon. Ready in under 20 minutes.
      </p>

      <!-- little info row -->
      <div class="recipe-meta">
        <span class="meta-item">⏱ 20 min</span>
        <span class="meta-item">🍽 2 servings</span>
        <span class="meta-item">⭐ Easy</span>
      </div>

      <h2 class="mini-heading">Ingredients</h2>
      <ul class="ingredient-list">
        <li>200g spaghetti</li>
        <li>4 cloves garlic, sliced</li>
        <li>1 lemon, juiced</li>
        <li>Chilli flakes, to taste</li>
        <li>Olive oil, parmesan, salt</li>
      </ul>

      <button class="btn">View Full Recipe</button>
    </div>

  </div>

</div>

</body>
</html>
